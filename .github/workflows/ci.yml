name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  quality:
    name: Lint, Test & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Last, so a newly published advisory doesn't hide lint and test results.
      - name: npm audit (fail on high vulnerabilities)
        run: npm audit --audit-level=high

  docker-build:
    name: Docker Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker image (production stage)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          target: production
          tags: discordserverbot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
